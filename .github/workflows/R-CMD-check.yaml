# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }}, Python ${{ matrix.config.python }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release', python: '3.12'}
          - {os: windows-latest, r: 'release', python: '3.12'}
          - {os: ubuntu-latest,  r: 'devel',   python: '3.12', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release', python: '3.12'}
          # Python 3.8 builds exist only for older runner images
          - {os: windows-latest, r: 'release', python: '3.8'}
          - {os: ubuntu-24.04,   r: 'release', python: '3.8'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.config.python }}

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
